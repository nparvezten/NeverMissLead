
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nevermisslead_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nevermisslead
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nevermisslead"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nevermisslead_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=nevermisslead;Username=postgres;Password=postgres
      - RagService__BaseUrl=http://rag-service:8000
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=5103
    ports:
      - "5103:5103"

  rag-service:
    build:
      context: ./rag-service
      dockerfile: Dockerfile
    container_name: nevermisslead_rag
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/nevermisslead
      - EMBEDDING_PROVIDER=local
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    ports:
      - "8000:8000"

volumes:
  postgres_data:
