<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 22px; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #64748b; }
      .actor-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 13px; fill: #1e293b; text-anchor: middle; }
      .step-num { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 11px; fill: #ffffff; text-anchor: middle; }
      .step-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 12px; fill: #1e293b; }
      .step-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #64748b; }
      .lifeline { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 4,4; }
      .msg-line { stroke: #f59e0b; stroke-width: 2; }
      .msg-return { stroke: #10b981; stroke-width: 2; stroke-dasharray: 4,4; }
      .loop-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 12px; fill: #1e40af; }
      .note-box { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #334155; }
    </style>

    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#3b82f6" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#f8fafc"/>
  <rect x="20" y="20" width="960" height="710" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Header -->
  <g transform="translate(50, 50)">
    <text x="0" y="20" class="title">Flow C: Lead Intent Capture &amp; Follow-up Automation</text>
    <text x="0" y="40" class="subtitle">Intent Classification &gt; Inline Capture &gt; AES-256 Storage &gt; Background IHostedService</text>
  </g>

  <!-- Actors & Lifelines -->
  <!-- 1. Visitor -->
  <g transform="translate(100, 110)">
    <rect x="-55" width="110" height="40" rx="8" fill="#f1f5f9" stroke="#cbd5e1" filter="url(#shadow)"/>
    <text x="0" y="25" class="actor-label">Visitor</text>
    <line x1="0" y1="40" x2="0" y2="570" class="lifeline"/>
  </g>

  <!-- 2. Chat Widget -->
  <g transform="translate(280, 110)">
    <rect x="-60" width="120" height="40" rx="8" fill="#fef3c7" stroke="#fde68a" filter="url(#shadow)"/>
    <text x="0" y="25" class="actor-label">Widget</text>
    <line x1="0" y1="40" x2="0" y2="570" class="lifeline"/>
  </g>

  <!-- 3. .NET API -->
  <g transform="translate(480, 110)">
    <rect x="-65" width="130" height="40" rx="8" fill="#ede9fe" stroke="#ddd6fe" filter="url(#shadow)"/>
    <text x="0" y="25" class="actor-label">.NET 10 API</text>
    <line x1="0" y1="40" x2="0" y2="570" class="lifeline"/>
  </g>

  <!-- 4. PostgreSQL -->
  <g transform="translate(680, 110)">
    <rect x="-65" width="130" height="40" rx="8" fill="#fee2e2" stroke="#fecaca" filter="url(#shadow)"/>
    <text x="0" y="25" class="actor-label">PostgreSQL</text>
    <line x1="0" y1="40" x2="0" y2="570" class="lifeline"/>
  </g>

  <!-- 5. Background Poller -->
  <g transform="translate(870, 110)">
    <rect x="-65" width="130" height="40" rx="8" fill="#dbeafe" stroke="#bfdbfe" filter="url(#shadow)"/>
    <text x="0" y="25" class="actor-label">IHostedService</text>
    <line x1="0" y1="40" x2="0" y2="570" class="lifeline"/>
  </g>

  <!-- Step 1: Buying intent -->
  <g transform="translate(0, 175)">
    <line x1="100" y1="0" x2="280" y2="0" class="msg-line" marker-end="url(#arrow-amber)"/>
    <circle cx="180" cy="-12" r="10" fill="#f59e0b"/>
    <text x="180" y="-8" class="step-num">1</text>
    <text x="200" y="-8" class="step-text">"Can I book a trial class?"</text>
  </g>

  <!-- Step 2: Classifier triggers inline form -->
  <g transform="translate(0, 225)">
    <line x1="280" y1="0" x2="480" y2="0" class="msg-line" marker-end="url(#arrow-amber)"/>
    <circle cx="370" cy="-12" r="10" fill="#f59e0b"/>
    <text x="370" y="-8" class="step-num">2</text>
    <text x="390" y="-8" class="step-text">High Lead Intent (0.95)</text>
    <line x1="480" y1="20" x2="280" y2="20" class="msg-return" marker-end="url(#arrow-green)"/>
    <text x="310" y="38" class="step-sub" fill="#059669">Prompt visitor: Name + Phone/Email</text>
  </g>

  <!-- Step 3: Inline Form Submission -->
  <g transform="translate(0, 290)">
    <line x1="100" y1="0" x2="280" y2="0" class="msg-line" marker-end="url(#arrow-amber)"/>
    <line x1="280" y1="0" x2="480" y2="0" class="msg-line" marker-end="url(#arrow-amber)"/>
    <circle cx="280" cy="-12" r="10" fill="#f59e0b"/>
    <text x="280" y="-8" class="step-num">3</text>
    <text x="300" y="-8" class="step-text">POST /api/v1/widget/{id}/lead</text>
  </g>

  <!-- Step 4: AES-256 Encryption & DB Persist -->
  <g transform="translate(0, 345)">
    <line x1="480" y1="0" x2="680" y2="0" class="msg-line" stroke="#6366f1" marker-end="url(#arrow-amber)"/>
    <circle cx="570" cy="-12" r="10" fill="#6366f1"/>
    <text x="570" y="-8" class="step-num">4</text>
    <text x="590" y="-8" class="step-text">INSERT leads &amp; follow_up_tasks</text>
    <text x="590" y="10" class="step-sub">AES-256 (name_enc, phone_enc)</text>
  </g>

  <!-- Step 5: Domain Event -->
  <g transform="translate(0, 395)">
    <line x1="480" y1="0" x2="280" y2="0" class="msg-return" marker-end="url(#arrow-green)"/>
    <line x1="280" y1="0" x2="100" y2="0" class="msg-return" marker-end="url(#arrow-green)"/>
    <circle cx="190" cy="-12" r="10" fill="#10b981"/>
    <text x="190" y="-8" class="step-num">5</text>
    <text x="210" y="-8" class="step-text" fill="#059669">"Thank you! The tutor will contact you."</text>
  </g>

  <!-- Background Polling Loop Section -->
  <g transform="translate(50, 445)">
    <rect width="900" height="210" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="20" y="25" class="loop-title">BACKGROUND POLLING LOOP (IHostedService — Every N Minutes)</text>
    
    <!-- Poller reads due tasks -->
    <g transform="translate(0, 40)">
      <line x1="820" y1="20" x2="630" y2="20" class="msg-line" stroke="#3b82f6" marker-end="url(#arrow-blue)"/>
      <circle cx="725" cy="8" r="9" fill="#3b82f6"/>
      <text x="725" y="12" class="step-num">6</text>
      <text x="640" y="8" class="step-text" fill="#1e40af">SELECT WHERE scheduled_for &lt;= now() AND status='pending'</text>
    </g>

    <!-- Dispatch follow up -->
    <g transform="translate(0, 100)">
      <rect x="580" y="0" width="280" height="38" rx="6" fill="#ffffff" stroke="#93c5fd" filter="url(#shadow)"/>
      <text x="590" y="16" class="note-box">• Dispatch transactional email (SMTP)</text>
      <text x="590" y="30" class="note-box">• Or prepare draft for owner notification</text>
    </g>

    <!-- Update task status -->
    <g transform="translate(0, 150)">
      <line x1="820" y1="20" x2="630" y2="20" class="msg-line" stroke="#10b981" marker-end="url(#arrow-green)"/>
      <circle cx="725" cy="8" r="9" fill="#10b981"/>
      <text x="725" y="12" class="step-num">7</text>
      <text x="640" y="8" class="step-text" fill="#059669">UPDATE follow_up_tasks SET status='sent', sent_at=now()</text>
    </g>
  </g>
</svg>
