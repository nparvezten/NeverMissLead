<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 22px; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #64748b; }
      .actor-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 13px; fill: #1e293b; text-anchor: middle; }
      .step-num { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 11px; fill: #ffffff; text-anchor: middle; }
      .step-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 12px; fill: #1e293b; }
      .step-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #64748b; }
      .lifeline { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 4,4; }
      .msg-line { stroke: #6366f1; stroke-width: 2; }
      .msg-return { stroke: #10b981; stroke-width: 2; stroke-dasharray: 4,4; }
      .branch-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 12px; }
      .branch-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#6366f1" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#d97706" />
    </marker>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#f8fafc"/>
  <rect x="20" y="20" width="960" height="740" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Header -->
  <g transform="translate(50, 50)">
    <text x="0" y="20" class="title">Flow B: Visitor Chat &amp; Grounded RAG Retrieval</text>
    <text x="0" y="40" class="subtitle">Cosine Search &gt; Strict Citation Generation &gt; Fallback Abstention / Handoff</text>
  </g>

  <!-- Actors & Lifelines -->
  <!-- 1. Visitor -->
  <g transform="translate(90, 110)">
    <rect x="-55" width="110" height="40" rx="8" fill="#f1f5f9" stroke="#cbd5e1" filter="url(#shadow)"/>
    <text x="0" y="25" class="actor-label">Visitor</text>
    <line x1="0" y1="40" x2="0" y2="600" class="lifeline"/>
  </g>

  <!-- 2. Chat Widget -->
  <g transform="translate(260, 110)">
    <rect x="-60" width="120" height="40" rx="8" fill="#e0e7ff" stroke="#c7d2fe" filter="url(#shadow)"/>
    <text x="0" y="25" class="actor-label">Chat Widget</text>
    <line x1="0" y1="40" x2="0" y2="600" class="lifeline"/>
  </g>

  <!-- 3. .NET API -->
  <g transform="translate(460, 110)">
    <rect x="-65" width="130" height="40" rx="8" fill="#ede9fe" stroke="#ddd6fe" filter="url(#shadow)"/>
    <text x="0" y="25" class="actor-label">.NET 10 API</text>
    <line x1="0" y1="40" x2="0" y2="600" class="lifeline"/>
  </g>

  <!-- 4. Python RAG -->
  <g transform="translate(680, 110)">
    <rect x="-70" width="140" height="40" rx="8" fill="#dcfce7" stroke="#bbf7d0" filter="url(#shadow)"/>
    <text x="0" y="25" class="actor-label">RAG Service</text>
    <line x1="0" y1="40" x2="0" y2="600" class="lifeline"/>
  </g>

  <!-- 5. LLM Client -->
  <g transform="translate(870, 110)">
    <rect x="-65" width="130" height="40" rx="8" fill="#fef3c7" stroke="#fde68a" filter="url(#shadow)"/>
    <text x="0" y="25" class="actor-label">ILlmClient</text>
    <line x1="0" y1="40" x2="0" y2="600" class="lifeline"/>
  </g>

  <!-- Step 1: Visitor asks question -->
  <g transform="translate(0, 180)">
    <line x1="90" y1="0" x2="260" y2="0" class="msg-line" marker-end="url(#arrow)"/>
    <circle cx="165" cy="-12" r="10" fill="#6366f1"/>
    <text x="165" y="-8" class="step-num">1</text>
    <text x="185" y="-8" class="step-text">"What are the Class 10 fees?"</text>
  </g>

  <!-- Step 2: Widget calls public endpoint -->
  <g transform="translate(0, 230)">
    <line x1="260" y1="0" x2="460" y2="0" class="msg-line" marker-end="url(#arrow)"/>
    <circle cx="350" cy="-12" r="10" fill="#6366f1"/>
    <text x="350" y="-8" class="step-num">2</text>
    <text x="370" y="-8" class="step-text">POST /api/v1/widget/{id}/chat</text>
    <text x="370" y="10" class="step-sub">(Rate limit: 30 req/min)</text>
  </g>

  <!-- Step 3: Query RAG for top-k -->
  <g transform="translate(0, 290)">
    <line x1="460" y1="0" x2="680" y2="0" class="msg-line" marker-end="url(#arrow)"/>
    <circle cx="560" cy="-12" r="10" fill="#6366f1"/>
    <text x="560" y="-8" class="step-num">3</text>
    <text x="580" y="-8" class="step-text">POST /query (top_k=4)</text>
    <text x="580" y="10" class="step-sub">WHERE business_id = %s</text>
  </g>

  <!-- Step 4: Return Chunks -->
  <g transform="translate(0, 350)">
    <line x1="680" y1="0" x2="460" y2="0" class="msg-return" marker-end="url(#arrow-green)"/>
    <circle cx="580" cy="-12" r="10" fill="#10b981"/>
    <text x="580" y="-8" class="step-num">4</text>
    <text x="480" y="-8" class="step-text" fill="#059669">RetrievedChunks (IDs + Text)</text>
  </g>

  <!-- Decision Branch Box -->
  <g transform="translate(50, 400)">
    <rect width="900" height="310" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="4,4"/>
    
    <!-- Path 1: Grounded Answer -->
    <g transform="translate(20, 20)">
      <rect width="860" height="125" rx="8" fill="#f0fdf4" stroke="#86efac"/>
      <text x="15" y="24" class="branch-title" fill="#166534">PATH 1: Relevant Context Found (High Confidence Answer)</text>
      
      <!-- Call LLM -->
      <line x1="390" y1="50" x2="800" y2="50" class="msg-line" marker-end="url(#arrow)"/>
      <circle cx="585" cy="38" r="9" fill="#6366f1"/>
      <text x="585" y="42" class="step-num">5a</text>
      <text x="605" y="42" class="step-text">GenerateAsync(strict_prompt, question, chunks)</text>
      
      <!-- LLM Returns Answer with Citations -->
      <line x1="800" y1="85" x2="390" y2="85" class="msg-return" marker-end="url(#arrow-green)"/>
      <circle cx="605" cy="73" r="9" fill="#10b981"/>
      <text x="605" y="77" class="step-num">6a</text>
      <text x="410" y="77" class="step-text" fill="#059669">LlmResponse(Answer, cited_chunk_ids=[chunk1])</text>
      
      <text x="15" y="112" class="branch-desc" fill="#15803d">✔ Message saved with cited_chunk_ids • Clean answer returned to visitor</text>
    </g>

    <!-- Path 2: Abstention / Handoff -->
    <g transform="translate(20, 160)">
      <rect width="860" height="125" rx="8" fill="#fffbeb" stroke="#fde68a"/>
      <text x="15" y="24" class="branch-title" fill="#92400e">PATH 2: Zero Context / LLM Unsure (Strict Abstention &amp; Handoff)</text>
      
      <line x1="390" y1="55" x2="190" y2="55" class="msg-line" stroke="#d97706" marker-end="url(#arrow-amber)"/>
      <circle cx="280" cy="43" r="9" fill="#d97706"/>
      <text x="280" y="47" class="step-num">5b</text>
      <text x="200" y="45" class="step-text" fill="#b45309">"I'm not sure. Let me connect you with the owner."</text>

      <text x="15" y="90" class="branch-desc" fill="#b45309">• sets needs_human = true on conversation • records handoff_reason in database</text>
      <text x="15" y="108" class="branch-desc" fill="#b45309">• Prompts visitor for contact details for direct owner follow-up</text>
    </g>
  </g>
</svg>
