<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 22px; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #64748b; }
      .actor-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 13px; fill: #1e293b; text-anchor: middle; }
      .step-num { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 11px; fill: #ffffff; text-anchor: middle; }
      .step-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 12px; fill: #1e293b; }
      .step-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #64748b; }
      .lifeline { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 4,4; }
      .msg-line { stroke: #6366f1; stroke-width: 2; }
      .msg-return { stroke: #10b981; stroke-width: 2; stroke-dasharray: 4,4; }
      .note-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #047857; font-weight: 500; }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#6366f1" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#f8fafc"/>
  <rect x="20" y="20" width="960" height="660" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Header -->
  <g transform="translate(50, 50)">
    <text x="0" y="20" class="title">Flow A: Knowledge Document Ingestion &amp; Embedding Pipeline</text>
    <text x="0" y="40" class="subtitle">From Owner Upload to PostgreSQL pgvector Chunk Storage</text>
  </g>

  <!-- Actors & Lifelines -->
  <!-- 1. Owner -->
  <g transform="translate(100, 110)">
    <rect x="-60" width="120" height="40" rx="8" fill="#f1f5f9" stroke="#cbd5e1" filter="url(#shadow)"/>
    <text x="0" y="25" class="actor-label">Owner</text>
    <line x1="0" y1="40" x2="0" y2="520" class="lifeline"/>
  </g>

  <!-- 2. Dashboard -->
  <g transform="translate(270, 110)">
    <rect x="-60" width="120" height="40" rx="8" fill="#e0f2fe" stroke="#bae6fd" filter="url(#shadow)"/>
    <text x="0" y="25" class="actor-label">Dashboard</text>
    <line x1="0" y1="40" x2="0" y2="520" class="lifeline"/>
  </g>

  <!-- 3. .NET API -->
  <g transform="translate(460, 110)">
    <rect x="-65" width="130" height="40" rx="8" fill="#ede9fe" stroke="#ddd6fe" filter="url(#shadow)"/>
    <text x="0" y="25" class="actor-label">.NET 10 API</text>
    <line x1="0" y1="40" x2="0" y2="520" class="lifeline"/>
  </g>

  <!-- 4. Python RAG -->
  <g transform="translate(670, 110)">
    <rect x="-70" width="140" height="40" rx="8" fill="#dcfce7" stroke="#bbf7d0" filter="url(#shadow)"/>
    <text x="0" y="25" class="actor-label">FastAPI RAG</text>
    <line x1="0" y1="40" x2="0" y2="520" class="lifeline"/>
  </g>

  <!-- 5. PostgreSQL -->
  <g transform="translate(860, 110)">
    <rect x="-65" width="130" height="40" rx="8" fill="#fee2e2" stroke="#fecaca" filter="url(#shadow)"/>
    <text x="0" y="25" class="actor-label">PostgreSQL</text>
    <line x1="0" y1="40" x2="0" y2="520" class="lifeline"/>
  </g>

  <!-- Step 1: Upload -->
  <g transform="translate(0, 180)">
    <line x1="100" y1="0" x2="270" y2="0" class="msg-line" marker-end="url(#arrow)"/>
    <circle cx="175" cy="-12" r="10" fill="#6366f1"/>
    <text x="175" y="-8" class="step-num">1</text>
    <text x="195" y="-8" class="step-text">Uploads FAQ / Pricing text</text>
  </g>

  <!-- Step 2: POST to API -->
  <g transform="translate(0, 230)">
    <line x1="270" y1="0" x2="460" y2="0" class="msg-line" marker-end="url(#arrow)"/>
    <circle cx="355" cy="-12" r="10" fill="#6366f1"/>
    <text x="355" y="-8" class="step-num">2</text>
    <text x="375" y="-8" class="step-text">POST /api/v1/.../documents</text>
  </g>

  <!-- Step 3: Insert Document -->
  <g transform="translate(0, 280)">
    <line x1="460" y1="0" x2="860" y2="0" class="msg-line" marker-end="url(#arrow)"/>
    <circle cx="650" cy="-12" r="10" fill="#6366f1"/>
    <text x="650" y="-8" class="step-num">3</text>
    <text x="670" y="-8" class="step-text">INSERT kb_documents row</text>
  </g>

  <!-- Step 4: Call RAG Service -->
  <g transform="translate(0, 330)">
    <line x1="460" y1="0" x2="670" y2="0" class="msg-line" marker-end="url(#arrow)"/>
    <circle cx="555" cy="-12" r="10" fill="#6366f1"/>
    <text x="555" y="-8" class="step-num">4</text>
    <text x="575" y="-8" class="step-text">POST /embed (raw_text)</text>
  </g>

  <!-- Processing Note (RAG side) -->
  <g transform="translate(580, 365)" filter="url(#shadow)">
    <rect width="180" height="42" rx="6" fill="#f0fdf4" stroke="#86efac"/>
    <text x="10" y="16" class="note-text">• Chunking (tiktoken)</text>
    <text x="10" y="32" class="note-text">• EmbeddingProvider.embed()</text>
  </g>

  <!-- Step 5: Direct pgvector insert -->
  <g transform="translate(0, 430)">
    <line x1="670" y1="0" x2="860" y2="0" class="msg-line" marker-end="url(#arrow)"/>
    <circle cx="755" cy="-12" r="10" fill="#6366f1"/>
    <text x="755" y="-8" class="step-num">5</text>
    <text x="775" y="-8" class="step-text">INSERT kb_chunks</text>
    <text x="775" y="10" class="step-sub">(vector + token_count)</text>
  </g>

  <!-- Step 6: Return chunks created -->
  <g transform="translate(0, 480)">
    <line x1="670" y1="0" x2="460" y2="0" class="msg-return" marker-end="url(#arrow-green)"/>
    <circle cx="575" cy="-12" r="10" fill="#10b981"/>
    <text x="575" y="-8" class="step-num">6</text>
    <text x="495" y="-8" class="step-text" fill="#059669">201 Created (chunk_ids)</text>
  </g>

  <!-- Step 7: Final confirmation -->
  <g transform="translate(0, 530)">
    <line x1="460" y1="0" x2="270" y2="0" class="msg-return" marker-end="url(#arrow-green)"/>
    <line x1="270" y1="0" x2="100" y2="0" class="msg-return" marker-end="url(#arrow-green)"/>
    <circle cx="190" cy="-12" r="10" fill="#10b981"/>
    <text x="190" y="-8" class="step-num">7</text>
    <text x="210" y="-8" class="step-text" fill="#059669">Document Ready</text>
  </g>
</svg>
